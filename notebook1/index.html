<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Both schemes are declared (night default, day via data-theme), so the browser never
     applies its forced-dark repaint — which crushed CodeMirror's translucent active-line
     highlight when this app was light-only. The meta is parsed before any stylesheet. -->
<meta name="color-scheme" content="dark light" />
<!-- Restore the viewer's day/night choice before first paint (no flash of the wrong
     mode). Storage may be unavailable; night is the default either way. -->
<script>try { if (localStorage.getItem('sem-theme') === 'day') document.documentElement.dataset.theme = 'day'; } catch (e) {}</script>
<title>Semantic Notebook — Architecting the Semantic Layer</title>
<!-- ALL runtime libraries are vendored under /vendor/globals/ (exact source
     versions in that directory's PROVENANCE.md) — no CDN fetches at runtime.
     Same rationale as the CodeMirror vendoring below, generalized after the
     scope of the risk sank in: "Conference wifi is unreliable. A live remote
     fetch during a demo is a liability" (DESIGN_DECISIONS). See ADR-006 rev. 2. -->
<script src="../vendor/globals/tailwindcss-play.js"></script>
<!-- n3 1.26.0 (up from 1.17.2): the first release line that ships N3.Reasoner, which
     materialization (scripts/notebook-context.js) needs. Stays within 1.x so the
     Store/Parser/Writer/DataFactory API the rest of the app uses is unchanged. See ADR-031. -->
<script src="../vendor/globals/n3.min.js"></script>
<script src="../vendor/globals/jsonld.min.js"></script>
<!-- Comunica (official comunica-browser UMD build of @comunica/query-sparql@2.10.0,
     exposes window.Comunica) — scripts/notebook-context.js reads the global. -->
<script src="../vendor/globals/comunica-browser.js"></script>

<!-- Cytoscape.js -->
<script src="../vendor/globals/cytoscape.min.js"></script>

<!-- Cola.js (peer dependency of cytoscape-cola) — must load before cytoscape-cola.js -->
<script src="../vendor/globals/cola.js"></script>

<script>
  // webcola's UMD build only exposes itself as window.cola, but cytoscape-cola's
  // browser build looks for window.webcola — without this alias, cytoscape-cola
  // silently binds its internal cola reference to undefined and only fails later,
  // inside a running layout, with "Cannot read properties of undefined (reading 'adaptor')".
  window.webcola = window.cola;
</script>

<!-- Cytoscape Cola layout — for cluster-aware force-directed layout (graph panels) -->
<script src="../vendor/globals/cytoscape-cola.js"></script>

<!-- fCoSE layout (compound-aware, packs disconnected components) — entity explorer only.
     Dependency chain layout-base → cose-base → cytoscape-fcose; each UMD reads the
     previous off its window global (layoutBase → coseBase → cytoscapeFcose), so unlike
     cola/webcola no aliasing shim is needed. Registered alongside cola, not in place of
     it — the graph panel stays on cola (ADR-010 rev. 2). -->
<script src="../vendor/globals/layout-base.js"></script>
<script src="../vendor/globals/cose-base.js"></script>
<script src="../vendor/globals/cytoscape-fcose.js"></script>

<script>
  cytoscape.use(cytoscapeCola);
  cytoscape.use(cytoscapeFcose);
</script>
<!-- Semantic Lounge: brand faces inlined as data URIs (no runtime fetch, ADR-006), then tokens. -->
<link rel="stylesheet" href="../styles/fonts.css">
<link rel="stylesheet" href="../styles/tokens.css">

<!-- CodeMirror and its dependency graph, vendored locally under /vendor/codemirror/
     (see that directory's provenance comments for exact source versions) rather than
     loaded from esm.sh at runtime — esm.sh's on-the-fly bundling was an intermittent
     single point of failure during conference-critical demos. -->
<script type="importmap">
{
  "imports": {
    "codemirror": "../vendor/codemirror/codemirror.js",
    "@codemirror/autocomplete": "../vendor/codemirror/codemirror-autocomplete.js",
    "@codemirror/commands": "../vendor/codemirror/codemirror-commands.js",
    "@codemirror/language": "../vendor/codemirror/codemirror-language.js",
    "@codemirror/lint": "../vendor/codemirror/codemirror-lint.js",
    "@codemirror/search": "../vendor/codemirror/codemirror-search.js",
    "@codemirror/state": "../vendor/codemirror/codemirror-state.js",
    "@codemirror/view": "../vendor/codemirror/codemirror-view.js",
    "@codemirror/lang-json": "../vendor/codemirror/codemirror-lang-json.js",
    "@codemirror/legacy-modes/mode/turtle": "../vendor/codemirror/codemirror-legacy-modes-turtle.js",
    "@codemirror/legacy-modes/mode/sparql": "../vendor/codemirror/codemirror-legacy-modes-sparql.js",
    "@lezer/common": "../vendor/codemirror/lezer-common.js",
    "@lezer/highlight": "../vendor/codemirror/lezer-highlight.js",
    "@lezer/lr": "../vendor/codemirror/lezer-lr.js",
    "@lezer/json": "../vendor/codemirror/lezer-json.js",
    "style-mod": "../vendor/codemirror/style-mod.js",
    "crelt": "../vendor/codemirror/crelt.js",
    "w3c-keyname": "../vendor/codemirror/w3c-keyname.js",
    "@marijn/find-cluster-break": "../vendor/codemirror/marijn-find-cluster-break.js"
  }
}
</script>
</head>
<body>

<!-- Page-level throbber: present in static HTML from the start, removed by bootstrap.js once notebook:ready fires. -->
<div id="page-throbber" class="fixed inset-0 z-50 flex items-center justify-center sem-throbber">
  <div class="sem-spinner"></div>
</div>

<!-- snap-y/snap-mandatory + overflow-y-scroll turns the stack of 100vh labs below
     into scroll-snap pages: a scroll gesture always lands on one full lab, never
     half of two. The fixed nav is unaffected — fixed positioning escapes this
     element's scroll flow entirely. -->
<!-- lab-class carries the page-chrome classes every generated <sem-lab> gets
     (fixed-nav offset, box-sizing, scroll-snap participation) — page concerns
     the definition has no business knowing about. The labs themselves are no
     longer hand-authored here: sem-notebook generates one <sem-lab> per entry
     in the definition's sembook:labs list, exactly as sem-lab generates its
     panels — one description, one source of structure.
     No scroll-mt-12 in lab-class — box-border + pt-12 already reserves 3rem of
     internal padding at the top of each 100vh lab for the fixed nav to overlay,
     so the lab's own content clears the nav without any scroll-position
     compensation. scroll-margin-top would ADDITIONALLY shift every snap resting
     position 3rem short of the natural i*100vh boundary — a lab is 100vh
     including its own pt-12, so with both pt-12 and scroll-mt-12 applied,
     scroll-snap only ever travels 100vh-3rem per gesture, cutting the
     destination lab's bottom 3rem off below the fold until a second, smaller
     scroll. Snapping to the very first lab happened to look fine regardless
     (the negative scroll-margin offset clamps to scrollTop 0), which is what
     made this easy to miss in one direction and not the other. -->
<sem-notebook
  uri="https://notebook.semantic.consulting/notebook1/"
  lab-class="pt-12 box-border snap-start snap-always"
  class="block h-screen overflow-y-scroll snap-y snap-mandatory">

  <nav id="lab-nav" class="fixed top-0 inset-x-0 z-40 h-12 flex items-center gap-3 px-4 text-sm sem-nav">
    <button
      id="lab-nav-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="lab-nav-drawer"
      aria-label="Toggle lab navigation"
      class="-ml-1 flex h-8 w-8 flex-col items-center justify-center gap-1 sem-nav-btn">
      <span class="block h-0.5 w-4 bg-current"></span>
      <span class="block h-0.5 w-4 bg-current"></span>
      <span class="block h-0.5 w-4 bg-current"></span>
    </button>
    <span class="sem-nav-title whitespace-nowrap">Architecting the Semantic Layer</span>
    <!-- Populated by build-nav.js with the active lab ("Lab 5 · Classes and Subclasses").
         Empty until the first lab intersects; build-nav owns all its updates. -->
    <span id="lab-nav-current" class="sem-sign truncate" hidden></span>
    <!-- Day/night: night is the stage default; day is the guide's paper mode, for long reading. -->
    <button id="theme-toggle" type="button" class="sem-theme-toggle ml-auto"></button>
  </nav>

  <!-- Backdrop and drawer sit below the fixed nav bar (top-12), not over it,
       so the hamburger button stays clickable while the drawer is open. -->
  <div
    id="lab-nav-backdrop"
    class="fixed inset-x-0 top-12 bottom-0 z-40 sem-backdrop opacity-0 pointer-events-none transition-opacity duration-200">
  </div>

  <aside
    id="lab-nav-drawer"
    aria-hidden="true"
    class="fixed left-0 top-12 bottom-0 z-50 w-64 -translate-x-full transform p-4 text-sm transition-transform duration-200 overflow-y-auto sem-drawer">
    <p class="sem-drawer-eyebrow mb-3">// labs</p>
    <!-- Anchor links are generated at runtime by scripts/build-nav.js from the
         notebook definition's sembook:labs list — do not hand-author them here,
         that's exactly the drift this was built to avoid. -->
    <nav id="lab-nav-links" class="flex flex-col gap-1"></nav>
  </aside>

  <!-- <sem-lab> elements are generated here at notebook:ready by sem-notebook,
       one per sembook:labs entry — do not hand-author them, that's the drift
       this component removed (see the lab-class note on <sem-notebook> above). -->

</sem-notebook>

<!-- sem-notebook.js must stay above the inline bootstrap module below: its
     notebook:ready listener (which generates the <sem-lab> elements) has to be
     registered before buildNav's, so the labs exist when buildNav looks them up. -->
<script type="module" src="../components/sem-notebook.js"></script>
<script type="module" src="../components/sem-lab.js"></script>
<script type="module" src="../components/sem-panel-jsonld.js"></script>
<script type="module" src="../components/sem-panel-jsonld-split.js"></script>
<script type="module" src="../components/sem-panel-graph.js"></script>
<script type="module" src="../components/sem-panel-entity.js"></script>
<script type="module" src="../components/sem-panel-vocab.js"></script>
<script type="module" src="../components/sem-panel-turtle.js"></script>
<script type="module" src="../components/sem-panel-turtle-writer.js"></script>
<script type="module" src="../components/sem-panel-sparql.js"></script>
<script type="module" src="../components/sem-panel-sparql-result.js"></script>
<script type="module">
  import { bootstrap } from '../scripts/bootstrap.js';
  import { buildNav } from '../scripts/build-nav.js';
  import { wireThemeToggle } from '../scripts/theme.js';

  wireThemeToggle(document.getElementById('theme-toggle'));

  document.addEventListener('notebook:ready', (e) => {
    buildNav(document.getElementById('lab-nav-links'), e.detail.notebookDoc);
  });

  bootstrap('../notebooks/intro.jsonld');
</script>

</body>
</html>
